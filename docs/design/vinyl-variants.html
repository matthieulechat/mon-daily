<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Variantes du vinyle en fond</title>
    <style>
      :root {
        --bg: #05080f;
        --sec: #0e1826;
        --fg: #e6edf7;
        --blue: #2f93ff;
        --yellow: #ffd23f;
        --muted: #7686a0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #02040a;
        color: var(--fg);
        font-family: Archivo, system-ui, sans-serif;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p.sub {
        color: var(--muted);
        margin: 0 0 20px;
        font-size: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 20px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
      }
      figcaption b {
        color: var(--fg);
      }
      .card {
        position: relative;
        height: 300px;
        overflow: hidden;
        border-radius: 14px;
        background: var(--bg);
        border: 1px solid rgb(230 237 247 / 0.08);
      }
      .ui {
        position: relative;
        z-index: 2;
        padding: 18px;
      }
      .ui .box {
        background: rgb(14 24 38 / 0.85);
        border: 1px solid rgb(230 237 247 / 0.08);
        border-radius: 12px;
        padding: 14px;
        max-width: 230px;
      }
      .ui .t {
        font-family: "Archivo Black", Archivo, sans-serif;
        font-size: 15px;
      }
      .ui .s {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .ui .btn {
        margin-top: 12px;
        display: inline-block;
        background: var(--blue);
        color: #03060c;
        font-weight: 700;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 999px;
      }
      .spin {
        animation: spin 40s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* A — actuel */
      .a .bg {
        position: absolute;
        inset: 0;
        transform-origin: 88% 8%;
        animation: spin 40s linear infinite;
        background-image:
          repeating-radial-gradient(
            circle at 88% 8%,
            transparent 0 9px,
            rgb(47 147 255 / 0.06) 9px 10px
          ),
          conic-gradient(
            from 0deg at 88% 8%,
            transparent 0deg,
            rgb(255 255 255 / 0.06) 12deg,
            transparent 26deg,
            transparent 360deg
          );
      }

      /* B — même vinyle, contraste ×3 */
      .b .bg {
        position: absolute;
        inset: 0;
        transform-origin: 88% 8%;
        animation: spin 40s linear infinite;
        background-image:
          repeating-radial-gradient(
            circle at 88% 8%,
            transparent 0 7px,
            rgb(47 147 255 / 0.2) 7px 8px
          ),
          conic-gradient(
            from 0deg at 88% 8%,
            transparent 0deg,
            rgb(255 255 255 / 0.14) 12deg,
            transparent 30deg,
            transparent 180deg,
            rgb(255 255 255 / 0.08) 192deg,
            transparent 210deg
          );
      }

      /* C — vrai disque : bord, pistes, label jaune, fondu */
      .disc {
        position: absolute;
        border-radius: 50%;
        animation: spin 40s linear infinite;
      }
      .c .disc {
        width: 520px;
        height: 520px;
        right: -190px;
        top: -190px;
        background:
          radial-gradient(
            circle,
            var(--yellow) 0 52px,
            #05080f 52px 58px,
            transparent 58px
          ),
          conic-gradient(
            from 0deg,
            transparent 0deg,
            rgb(255 255 255 / 0.16) 14deg,
            transparent 34deg,
            transparent 180deg,
            rgb(255 255 255 / 0.1) 194deg,
            transparent 214deg
          ),
          repeating-radial-gradient(
            circle,
            rgb(47 147 255 / 0.22) 0 1px,
            transparent 1px 7px
          ),
          radial-gradient(circle, #0b1220 0 100%);
        box-shadow:
          0 0 0 2px rgb(230 237 247 / 0.12),
          inset 0 0 0 14px rgb(255 255 255 / 0.03);
      }

      /* D — néon : sillons lumineux bleus + label qui brille */
      .d .disc {
        width: 520px;
        height: 520px;
        right: -190px;
        top: -190px;
        background:
          radial-gradient(circle, var(--yellow) 0 50px, transparent 50px),
          repeating-radial-gradient(
            circle,
            rgb(47 147 255 / 0.55) 0 1px,
            transparent 1px 11px
          );
        -webkit-mask: radial-gradient(circle, #000 0 38%, transparent 70%);
        mask: radial-gradient(circle, #000 0 38%, transparent 70%);
        filter: drop-shadow(0 0 6px rgb(47 147 255 / 0.8));
      }

      /* E — gros disque bas-droite, pistes groupées façon album */
      .e .disc {
        width: 620px;
        height: 620px;
        right: -220px;
        bottom: -300px;
        background:
          radial-gradient(
            circle,
            var(--yellow) 0 60px,
            #05080f 60px 66px,
            transparent 66px
          ),
          conic-gradient(
            from 20deg,
            transparent 0deg,
            rgb(255 255 255 / 0.12) 16deg,
            transparent 40deg,
            transparent 200deg,
            rgb(255 255 255 / 0.08) 216deg,
            transparent 240deg
          ),
          repeating-radial-gradient(
            circle,
            rgb(47 147 255 / 0.16) 0 1px,
            transparent 1px 6px
          ),
          repeating-radial-gradient(
            circle,
            transparent 0 40px,
            rgb(255 255 255 / 0.05) 40px 42px,
            transparent 42px 70px
          ),
          #0a1424;
        box-shadow: 0 0 80px rgb(47 147 255 / 0.15);
      }

      /* F — sillons seuls mais épais et plein écran, 2 couleurs, très lisibles */
      .f .bg {
        position: absolute;
        inset: -30%;
        animation: spin 60s linear infinite;
        background:
          repeating-radial-gradient(
            circle at 70% 30%,
            transparent 0 14px,
            rgb(47 147 255 / 0.16) 14px 16px,
            transparent 16px 30px,
            rgb(255 210 63 / 0.07) 30px 31px
          ),
          conic-gradient(
            from 0deg at 70% 30%,
            transparent 0deg,
            rgb(255 255 255 / 0.1) 10deg,
            transparent 28deg,
            transparent 360deg
          );
        -webkit-mask: radial-gradient(
          circle at 70% 30%,
          #000 0 40%,
          transparent 75%
        );
        mask: radial-gradient(circle at 70% 30%, #000 0 40%, transparent 75%);
      }

      @media (prefers-reduced-motion: reduce) {
        .card * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <h1>Vinyle en fond — 6 variantes</h1>
    <p class="sub">
      Fond réel #05080f, même animation lente (40 s). Aperçu dans une carte de
      420×300 : sur l'appli, le disque est plus grand.
    </p>
    <div class="grid">
      <figure>
        <div class="card a">
          <div class="bg"></div>
          <div class="ui">
            <div class="box">
              <div class="t">Mon Daily</div>
              <div class="s">Playlist du jour</div>
              <span class="btn">Générer</span>
            </div>
          </div>
        </div>
        <figcaption>
          <b>A — Actuel</b> : sillons 6 %, reflet 6 %. Référence.
        </figcaption>
      </figure>

      <figure>
        <div class="card b">
          <div class="bg"></div>
          <div class="ui">
            <div class="box">
              <div class="t">Mon Daily</div>
              <div class="s">Playlist du jour</div>
              <span class="btn">Générer</span>
            </div>
          </div>
        </div>
        <figcaption>
          <b>B — Contraste ×3</b> : même dessin, sillons 20 %, deux reflets.
          Changement minimal.
        </figcaption>
      </figure>

      <figure>
        <div class="card c">
          <div class="disc"></div>
          <div class="ui">
            <div class="box">
              <div class="t">Mon Daily</div>
              <div class="s">Playlist du jour</div>
              <span class="btn">Générer</span>
            </div>
          </div>
        </div>
        <figcaption>
          <b>C — Vrai disque</b> : bord, label jaune, sillons et reflets. Il se
          lit comme un vinyle.
        </figcaption>
      </figure>

      <figure>
        <div class="card d">
          <div class="disc"></div>
          <div class="ui">
            <div class="box">
              <div class="t">Mon Daily</div>
              <div class="s">Playlist du jour</div>
              <span class="btn">Générer</span>
            </div>
          </div>
        </div>
        <figcaption>
          <b>D — Néon</b> : sillons bleus lumineux (glow), label jaune, fondu
          vers le centre de l'écran.
        </figcaption>
      </figure>

      <figure>
        <div class="card e">
          <div class="disc"></div>
          <div class="ui">
            <div class="box">
              <div class="t">Mon Daily</div>
              <div class="s">Playlist du jour</div>
              <span class="btn">Générer</span>
            </div>
          </div>
        </div>
        <figcaption>
          <b>E — Grand disque bas-droite</b> : pistes groupées façon album, halo
          bleu, davantage de présence.
        </figcaption>
      </figure>

      <figure>
        <div class="card f">
          <div class="bg"></div>
          <div class="ui">
            <div class="box">
              <div class="t">Mon Daily</div>
              <div class="s">Playlist du jour</div>
              <span class="btn">Générer</span>
            </div>
          </div>
        </div>
        <figcaption>
          <b>F — Sillons épais bicolores</b> : bleu + fil jaune, sans disque
          dessiné, fondu en halo.
        </figcaption>
      </figure>
    </div>
  </body>
</html>
