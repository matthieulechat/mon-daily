<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Durée max d'un épisode — 4 propositions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #05080f;
        --secondary: #0e1826;
        --fg: #e6edf7;
        --muted: #7686a0;
        --blue: #2f93ff;
        --yellow: #ffd23f;
        --lime: #a3e635;
        --border: rgb(230 237 247 / 0.08);
        --mono: "JetBrains Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #02040a;
        color: var(--fg);
        font-family: Archivo, system-ui, sans-serif;
      }
      h1 {
        font: 20px "Archivo Black", sans-serif;
        margin: 0 0 4px;
      }
      p.sub {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 14px;
        max-width: 70ch;
        line-height: 1.5;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr));
        gap: 32px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-size: 13px;
        color: var(--muted);
        margin-top: 12px;
        line-height: 1.55;
      }
      figcaption b {
        color: var(--fg);
      }
      figcaption .tag {
        display: inline-block;
        margin-right: 6px;
        padding: 1px 8px;
        border-radius: 999px;
        background: var(--yellow);
        color: #03060c;
        font-weight: 600;
        font-size: 11px;
      }

      /* ---- Repris de web/src/index.css ---- */
      .amp {
        padding: 20px;
        border-radius: 16px;
        border: 1px solid rgb(47 147 255 / 0.6);
        background:
          radial-gradient(circle at 12px 12px, #7d8898 0 2px, transparent 3px),
          radial-gradient(circle at calc(100% - 12px) 12px, #7d8898 0 2px, transparent 3px),
          radial-gradient(circle at 12px calc(100% - 12px), #7d8898 0 2px, transparent 3px),
          radial-gradient(circle at calc(100% - 12px) calc(100% - 12px), #7d8898 0 2px, transparent 3px),
          linear-gradient(160deg, #101a2b 0%, #060a12 45%, #0a1220 100%);
        box-shadow:
          0 0 0 1px rgb(47 147 255 / 0.35),
          0 0 36px rgb(47 147 255 / 0.22),
          inset 0 1px 0 rgb(255 255 255 / 0.1);
      }
      .amp > * + * {
        margin-top: 16px;
      }
      .card {
        padding: 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--bg);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .display {
        flex: 1;
        min-width: 0;
        padding: 12px 16px;
        border-radius: 6px;
        background: #02060c;
        color: #7fd0ff;
        font-family: var(--mono);
        text-shadow: 0 0 8px rgb(47 147 255 / 0.9);
        border: 1px solid rgb(0 0 0 / 0.6);
        box-shadow:
          inset 0 2px 8px rgb(0 0 0 / 0.8),
          0 0 0 1px #1f6fd0;
      }
      .display p {
        margin: 0;
      }
      .cap {
        font-size: 9px;
        letter-spacing: 0.2em;
        opacity: 0.7;
      }
      .big {
        font-size: 36px;
        line-height: 1.25;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      .mid {
        font-size: 22px;
        line-height: 1.3;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        letter-spacing: 0.2em;
        opacity: 0.85;
      }
      .wave {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 16px;
        margin: 8px 0 4px;
      }
      .wave i {
        flex: 1;
        border-radius: 2px;
        background: #7fd0ff;
        box-shadow: 0 0 6px rgb(47 147 255 / 0.9);
        opacity: 0.6;
      }
      .knob-wrap {
        flex: none;
        text-align: center;
      }
      .knob {
        --s: 88px;
        position: relative;
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        background:
          repeating-conic-gradient(rgb(255 255 255 / 0) 0 4deg, rgb(255 255 255 / 0.07) 4deg 5deg),
          conic-gradient(from 20deg, #2a3447, #0c121c, #2a3447, #0c121c, #2a3447);
        box-shadow:
          0 6px 14px rgb(0 0 0 / 0.6),
          inset 0 0 0 2px rgb(0 0 0 / 0.35),
          inset 0 2px 2px rgb(255 255 255 / 0.25);
      }
      .knob.sm {
        --s: 58px;
      }
      .knob::after {
        content: "";
        position: absolute;
        inset: 15%;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #2a3447, #0c121c 70%);
      }
      .knob span {
        position: absolute;
        inset: 0;
        z-index: 1;
        transform: rotate(var(--a));
      }
      .knob span i {
        position: absolute;
        left: 50%;
        top: 7%;
        width: 4px;
        height: 17%;
        margin-left: -2px;
        border-radius: 2px;
        background: var(--blue);
        box-shadow: 0 0 6px var(--blue);
      }
      .knob-label {
        display: block;
        margin-top: 10px;
        font-size: 9px;
        letter-spacing: 0.2em;
        color: var(--muted);
      }

      /* ---- Carte Sources (aperçu tronqué) ---- */
      .src-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .src-head b {
        font-size: 14px;
        font-weight: 600;
      }
      .badge {
        margin-left: 8px;
        padding: 2px 10px;
        border-radius: 999px;
        background: var(--secondary);
        font-size: 11px;
        color: var(--muted);
      }
      .search {
        padding: 6px 16px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--secondary);
        color: var(--muted);
        font-size: 14px;
      }
      .ghost {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 16px;
        -webkit-mask-image: linear-gradient(#000 20%, transparent);
        mask-image: linear-gradient(#000 20%, transparent);
      }
      .ghost i {
        height: 56px;
        border-radius: 14px;
        background: var(--secondary);
        border: 1px solid var(--border);
      }

      /* ---- C : touches de présélection ---- */
      .presets-title {
        display: flex;
        justify-content: space-between;
        margin: 0 0 10px;
        font-size: 9px;
        letter-spacing: 0.2em;
        color: var(--muted);
      }
      .presets {
        display: flex;
        gap: 8px;
      }
      .preset {
        flex: 1;
        padding: 16px 0 9px;
        position: relative;
        border: 0;
        border-radius: 6px;
        font: 500 11px var(--mono);
        color: var(--muted);
        background: linear-gradient(#1a2436, #0c121c);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 0.14),
          0 3px 6px rgb(0 0 0 / 0.55);
      }
      .preset::before {
        content: "";
        position: absolute;
        top: 6px;
        left: 50%;
        width: 5px;
        height: 5px;
        margin-left: -2.5px;
        border-radius: 50%;
        background: #26324a;
      }
      .preset[aria-checked="true"] {
        color: #7fd0ff;
        text-shadow: 0 0 8px rgb(47 147 255 / 0.9);
        box-shadow:
          inset 0 2px 5px rgb(0 0 0 / 0.7),
          0 0 0 1px var(--blue),
          0 0 14px rgb(47 147 255 / 0.35);
      }
      .preset[aria-checked="true"]::before {
        background: var(--lime);
        box-shadow: 0 0 8px var(--lime);
      }

      /* ---- D : curseur dans Sources ---- */
      .filter {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 14px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--secondary);
        font-size: 13px;
      }
      .filter b {
        font: 700 13px var(--mono);
        color: var(--yellow);
        white-space: nowrap;
      }
      .track {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--yellow) 45%, var(--border) 45%);
        position: relative;
      }
      .track::after {
        content: "";
        position: absolute;
        left: 45%;
        top: 50%;
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        border-radius: 50%;
        background: var(--yellow);
        border: 2px solid var(--bg);
      }
    </style>
  </head>
  <body>
    <h1>Durée max d'un épisode — 4 propositions</h1>
    <p class="sub">
      Nouveau réglage : au-delà de cette durée, un épisode de podcast n'entre pas dans le mix (valeur
      par défaut 1 h 30). Maquettes statiques reprenant les styles réels de l'app ; la carte Sources
      est tronquée.
    </p>

    <div class="grid">
      <!-- A -->
      <figure>
        <div class="amp">
          <div class="card row">
            <div class="display">
              <div class="row" style="gap: 18px; align-items: flex-end">
                <div>
                  <p class="cap">DURÉE MAXIMALE</p>
                  <p class="big">4 H 00</p>
                </div>
                <div style="border-left: 1px solid rgb(127 208 255 / 0.25); padding-left: 18px">
                  <p class="cap">ÉPISODE MAX</p>
                  <p class="mid">1 H 30</p>
                </div>
              </div>
              <div class="wave">
                <i style="height:30%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:55%"></i><i style="height:35%"></i><i style="height:80%"></i><i style="height:25%"></i><i style="height:60%"></i><i style="height:40%"></i><i style="height:95%"></i><i style="height:50%"></i>
              </div>
              <p class="foot"><span>READY</span><span>DAILY</span></p>
            </div>
            <div class="knob-wrap">
              <div class="knob" style="--a: -20deg"><span><i></i></span></div>
              <span class="knob-label">DURÉE</span>
            </div>
            <div class="knob-wrap">
              <div class="knob" style="--a: -11deg"><span><i></i></span></div>
              <span class="knob-label">ÉPISODE</span>
            </div>
          </div>
          <div class="card">
            <div class="src-head">
              <span><b>Sources</b><span class="badge">93/106 actives</span></span>
              <span class="search">Rechercher…</span>
            </div>
            <div class="ghost"><i></i><i></i><i></i></div>
          </div>
        </div>
        <figcaption>
          <b>A — Deux potards jumeaux.</b> L'afficheur montre les deux valeurs, chaque potard règle la
          sienne (pas de 15 min). Réutilise le composant Knob tel quel. Sur téléphone, les deux potards
          passent sous l'afficheur, faute de place.
        </figcaption>
      </figure>

      <!-- B -->
      <figure>
        <div class="amp">
          <div class="card row">
            <div class="display">
              <p class="cap">DURÉE MAXIMALE</p>
              <p class="big">4 H 00</p>
              <div class="wave">
                <i style="height:30%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:55%"></i><i style="height:35%"></i><i style="height:80%"></i><i style="height:25%"></i><i style="height:60%"></i><i style="height:40%"></i><i style="height:95%"></i><i style="height:50%"></i>
              </div>
              <p class="foot"><span>READY</span><span>ÉPISODE ≤ 1 H 30</span></p>
            </div>
            <div class="knob-wrap">
              <div class="knob" style="--a: -20deg"><span><i></i></span></div>
              <span class="knob-label">DURÉE</span>
            </div>
            <div class="knob-wrap">
              <div class="knob sm" style="--a: -11deg"><span><i></i></span></div>
              <span class="knob-label">ÉPISODE</span>
            </div>
          </div>
          <div class="card">
            <div class="src-head">
              <span><b>Sources</b><span class="badge">93/106 actives</span></span>
              <span class="search">Rechercher…</span>
            </div>
            <div class="ghost"><i></i><i></i><i></i></div>
          </div>
        </div>
        <figcaption>
          <b>B — Petit potard secondaire.</b> La durée totale reste la vedette ; la limite par épisode
          s'affiche sur la ligne du bas (à la place de « DAILY ») et se règle au petit potard. Le plus
          discret, mais la valeur est petite à lire et le petit potard est moins précis au doigt.
        </figcaption>
      </figure>

      <!-- C -->
      <figure>
        <div class="amp">
          <div class="card row">
            <div class="display">
              <p class="cap">DURÉE MAXIMALE</p>
              <p class="big">4 H 00</p>
              <div class="wave">
                <i style="height:30%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:55%"></i><i style="height:35%"></i><i style="height:80%"></i><i style="height:25%"></i><i style="height:60%"></i><i style="height:40%"></i><i style="height:95%"></i><i style="height:50%"></i>
              </div>
              <p class="foot"><span>READY</span><span>DAILY</span></p>
            </div>
            <div class="knob-wrap">
              <div class="knob" style="--a: -20deg"><span><i></i></span></div>
              <span class="knob-label">DURÉE</span>
            </div>
          </div>
          <div class="card">
            <p class="presets-title"><span>DURÉE MAX D'UN ÉPISODE</span><span>PODCASTS</span></p>
            <div class="presets" role="radiogroup" aria-label="Durée max d'un épisode">
              <button class="preset" role="radio" aria-checked="false">30 MIN</button>
              <button class="preset" role="radio" aria-checked="false">45 MIN</button>
              <button class="preset" role="radio" aria-checked="false">1 H</button>
              <button class="preset" role="radio" aria-checked="true">1 H 30</button>
              <button class="preset" role="radio" aria-checked="false">2 H</button>
              <button class="preset" role="radio" aria-checked="false">SANS</button>
            </div>
          </div>
          <div class="card">
            <div class="src-head">
              <span><b>Sources</b><span class="badge">93/106 actives</span></span>
              <span class="search">Rechercher…</span>
            </div>
            <div class="ghost"><i></i><i></i><i></i></div>
          </div>
        </div>
        <figcaption>
          <span class="tag">Recommandée</span><b>C — Touches de présélection.</b> Une rangée de
          touches d'ampli avec voyant, entre l'afficheur et les sources. Toutes les valeurs sont
          visibles d'un coup, « SANS » limite comprise, et ça tient tel quel sur téléphone. Demande un
          nouveau petit composant et ajoute une carte à la page.
        </figcaption>
      </figure>

      <!-- D -->
      <figure>
        <div class="amp">
          <div class="card row">
            <div class="display">
              <p class="cap">DURÉE MAXIMALE</p>
              <p class="big">4 H 00</p>
              <div class="wave">
                <i style="height:30%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:90%"></i><i style="height:55%"></i><i style="height:35%"></i><i style="height:80%"></i><i style="height:25%"></i><i style="height:60%"></i><i style="height:40%"></i><i style="height:95%"></i><i style="height:50%"></i>
              </div>
              <p class="foot"><span>READY</span><span>DAILY</span></p>
            </div>
            <div class="knob-wrap">
              <div class="knob" style="--a: -20deg"><span><i></i></span></div>
              <span class="knob-label">DURÉE</span>
            </div>
          </div>
          <div class="card">
            <div class="src-head">
              <span><b>Sources</b><span class="badge">93/106 actives</span></span>
              <span class="search">Rechercher…</span>
            </div>
            <div class="filter">
              <span>Épisodes jusqu'à</span>
              <b>1 h 30</b>
              <div class="track" role="presentation"></div>
            </div>
            <div class="ghost"><i></i><i></i><i></i></div>
          </div>
        </div>
        <figcaption>
          <b>D — Curseur dans la carte Sources.</b> Le réglage vit là où il agit : c'est un filtre sur
          les podcasts, pas sur la playlist. Réutilise le slider déjà stylé de l'app, le moins de code.
          En contrepartie il sort de l'univers « façade d'ampli » et se remarque moins.
        </figcaption>
      </figure>
    </div>
  </body>
</html>
